# Spring Data JPA & MySQL Configuration for Railway
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server Configuration
server.port=${PORT:8080}

# Frontend URL
frontend.url=${FRONTEND_URL:http://localhost:5173}

# Task Automation Job Schedule
automation.schedule.cron=0 */15 * * * *

# Google OAuth2 Client Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email,https://www.googleapis.com/auth/gmail.readonly,https://www.googleapis.com/auth/gmail.send

# Gemini AI API Keys
gemini.api.key.voice=${GEMINI_API_KEY_VOICE:default}
openai.api.key.chat=${OPENAI_API_KEY_CHAT:default}
openrouter.api.key.task=${OPENROUTER_API_KEY_TASK:default}
